; =============================================================================
;  Hệ thống giám sát & cảnh báo té ngã cho người cao tuổi
;  Radar 60 GHz DFRobot C1001 (SEN0623) + ESP32-S3 DevKitC-1 N16R8
;  Đồ án tổng hợp (402114)
; =============================================================================
;  Các phiên bản dưới đây được ghim cố định để nhiều tháng sau build lại vẫn ra
;  đúng kết quả như hôm nay:
;    - espressif32 6.9.0  -> arduino-esp32 2.0.17 (bản ổn định, nhiều tài liệu)
;    - bản fork async của ESPHome tương thích tốt với arduino-esp32 2.x
;
;  Các lệnh thường dùng:
;    pio run -t upload     nạp firmware
;    pio run -t uploadfs   nạp thư mục data/ (trang web + file WAV) vào LittleFS
;    pio device monitor    xem cổng serial
;
;  CẮM CÁP VÀO CỔNG NÀO? Board DevKitC-1 có hai cổng USB-C. Hãy cắm vào cổng ghi
;  chữ "UART" (cổng COM sẽ hiện ra trong Device Manager). Cấu hình dưới đây đưa
;  Serial ra UART0, tức là cổng đó.
; =============================================================================

[env:esp32-s3-devkitc-1-n16r8]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Board N16R8: Flash 16MB + PSRAM 8MB loại Octal (OPI) ---
; memory_type = qio_opi là BẮT BUỘC với loại N16R8, thiếu dòng này PSRAM không chạy.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions.csv
board_build.filesystem          = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0     ; Serial đi ra UART0 -> xem log ở cổng "UART"
    -DCORE_DEBUG_LEVEL=2
    -Wno-deprecated-declarations
    ; --- Mã nguồn được chia theo LAYER trong src/ cho dễ kiểm soát ---
    ;   src/core    : lõi nghiệp vụ, không phụ thuộc phần cứng cụ thể (kiểu dữ
    ;                 liệu chung, cầu nối web, model AI tự huấn luyện)
    ;   src/hal     : lớp chạm phần cứng (radar, âm thanh I2S, nút/LED, RF 433)
    ;   src/net     : mạng (Telegram, máy chủ web + WebSocket)
    ;   src/storage : lưu trữ (nhật ký sự kiện trên LittleFS)
    ; Thêm các thư mục này vào đường dẫn tìm header để giữ #include dạng gọn
    ; (ví dụ #include "radar.h") mà không phải viết đường dẫn tương đối dài.
    -I src/core
    -I src/hal
    -I src/net
    -I src/storage

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800

lib_deps =
    ; Thư viện radar C1001 KHÔNG có trên registry của PlatformIO, và link ghi
    ; trong bản kế hoạch (cdjq/DFRobot_HumanDetection) đã bị xóa (404). Bản chính
    ; chủ đã được tải sẵn vào lib/DFRobot_HumanDetection/ nên không cần khai ở đây:
    ; PlatformIO tự nhận thư viện trong thư mục lib/. Nhờ vậy build được cả khi
    ; không có mạng, và bạn đọc được mã nguồn thư viện ngay trong project.
    ; Nguồn: https://github.com/DFRobot/DFRobot_HumanDetection
    bblanchon/ArduinoJson@7.2.1
    ; Giai ma remote 433 MHz (EV1527/PT2262) cho nut SOS deo tay
    sui77/rc-switch@2.6.4
    esphome/AsyncTCP-esphome@2.1.4
    esphome/ESPAsyncWebServer-esphome@3.2.2
    ; Giai ma MP3 cho tro ly hoi thoai (kieu Xiaozhi): dashboard tra ve TTS dang
    ; MP3 qua /api/tts, firmware giai ma roi phat ra loa MAX98357A. Chi dung bo
    ; GIAI MA + nguon HTTP cua thu vien nay; con viec ghi ra I2S van dung driver
    ; I2S_NUM_0 san co trong src/hal/audio.cpp (tranh cai 2 driver tren 1 cong).
    earlephilhower/ESP8266Audio@1.9.7
